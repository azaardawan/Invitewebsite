<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"http://cafe.test/three/build/three.module.js","three/addons/":"http://cafe.test/three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { root, seats, tables } from './lib.js';
import { barista, cleaner } from './barista.js';
import { walkways } from './nav.js';
import { signs } from './build.js';
import { terraceChairs, loungeChairs, koupCorner, mirrors } from './rooms.js';
try {
  await signs();
  await terraceChairs();
  await loungeChairs();
  await koupCorner();
  await mirrors();
  await barista();
  await cleaner();
  // Where visitors begin: on the pavement at the foot of the north stairs, looking at the café.
  const start = new THREE.Object3D();
  start.name = 'START';
  start.position.set(7.3, -2.86, -3.1);
  start.rotation.y = Math.PI / 2;
  root.add(start);
  // the waiter's walkways, and how he reaches each seat (before the merge: the furniture's blocks are still apart)
  const waiterWays = walkways(seats);
  const scene0 = new THREE.Scene();
  scene0.add(root);
  scene0.updateMatrixWorld(true);
  // One mesh per material (and per kind: solid, walk-through, invisible wall): a phone draws it in few calls.
  const { mergeGeometries, mergeVertices } = await import('three/addons/utils/BufferGeometryUtils.js');
  const buckets = new Map();
  // the barista is kept as he is (his joints move in the tour), apart from the merge
  const people = ['BARISTA', 'CLEANER'].map((n) => root.getObjectByName(n));
  const isMan = (o) => { for (let p = o; p; p = p.parent) if (people.includes(p)) return true; return false; };
  scene0.traverse(o => {
    if (!o.isMesh || isMan(o)) return;
    let kind = 'S';
    for (let p = o; p; p = p.parent) { if (/^NOCOLLIDE/i.test(p.name)) kind = 'N'; if (/^COLLIDER/i.test(p.name)) kind = 'C'; }
    let g = o.geometry.clone();
    for (const k of Object.keys(g.attributes)) if (!['position','normal','uv'].includes(k)) g.deleteAttribute(k);
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2), 2));
    if (!g.attributes.normal) g.computeVertexNormals();
    if (!g.index) { const n=g.attributes.position.count; const idx=new Uint32Array(n); for(let i=0;i<n;i++) idx[i]=i; g.setIndex(new THREE.BufferAttribute(idx,1)); }
    g.clearGroups();
    g.applyMatrix4(o.matrixWorld);
    g = mergeVertices(g, 1e-4);
    const key = o.material.uuid + kind;
    if (!buckets.has(key)) buckets.set(key, { mat: o.material, kind, geos: [] });
    buckets.get(key).geos.push(g);
  });
  const scene = new THREE.Scene();
  const out = new THREE.Group(); out.name = 'KOUPUP'; scene.add(out);
  let n = 0;
  for (const b of buckets.values()) {
    // in chunks of under 65,536 points, so each can use small (16-bit) indices
    let chunk = [], count = 0;
    const flush = () => {
      if (!chunk.length) return;
      const merged = mergeGeometries(chunk, false);
      merged.setIndex(new THREE.BufferAttribute(Uint16Array.from(merged.index.array), 1));
      const m = new THREE.Mesh(merged, b.mat);
      m.name = (b.kind === 'N' ? 'NOCOLLIDE_' : b.kind === 'C' ? 'COLLIDER_' : 'part_') + (n++);
      out.add(m);
      chunk = []; count = 0;
    };
    for (const g of b.geos) {
      if (count + g.attributes.position.count > 65000) flush();
      chunk.push(g); count += g.attributes.position.count;
    }
    flush();
  }
  const startCopy = new THREE.Object3D(); startCopy.name='START';
  root.getObjectByName('START').getWorldPosition(startCopy.position);
  startCopy.rotation.y = Math.PI / 2; out.add(startCopy);
  // the tour page's spots (HOTSPOT_<what>, e.g. the counter) and the barista's places: kept as named points
  root.traverse(o => {
    if (!/^(HOTSPOT_|BARISTA_(coffee|cookies|steam)|CLEANER_stop_|NAV_)/.test(o.name)) return;
    const h = new THREE.Object3D(); h.name = o.name; h.userData = o.userData; o.getWorldPosition(h.position); o.getWorldQuaternion(h.quaternion); out.add(h);
  });
  for (const m of people) out.add(m);
  // the seats (SEAT_<n>): where a visitor sits, the way they face (yaw), the eye above the seat and, when a table is
  // within reach, the spot on it nearest them (where their coffee is put down)
  const v = new THREE.Vector3(), q = new THREE.Vector3();
  seats.forEach((s, i) => {
    const at = s.g.localToWorld(new THREE.Vector3(s.dx, s.h, s.dz * s.fwd));
    const fwd = new THREE.Vector3(0, 0, s.fwd).transformDirection(s.g.matrixWorld).setY(0).normalize();
    const floor = s.g.getWorldPosition(new THREE.Vector3()).y;
    const reach = at.clone().addScaledVector(fwd, 0.45);
    let best = null;
    for (const t of tables) {
      const top = t.g.getWorldPosition(new THREE.Vector3()).y + t.h;
      if (Math.abs(t.g.getWorldPosition(v).y - floor) > 0.3) continue;
      const p = t.g.worldToLocal(q.copy(reach));
      if (t.round) { const r = Math.hypot(p.x, p.z), m = Math.max(0.05, t.hw - 0.09); if (r > m) { p.x *= m / r; p.z *= m / r; } }
      else { p.x = Math.max(-t.hw + 0.09, Math.min(t.hw - 0.09, p.x)); p.z = Math.max(-t.hd + 0.09, Math.min(t.hd - 0.09, p.z)); }
      p.y = t.h;
      const w = t.g.localToWorld(p.clone());
      const d = Math.hypot(w.x - at.x, w.z - at.z);
      if (d < 1.05 && (!best || d < best.d)) best = { d, at: [w.x, top, w.z].map(n => Math.round(n * 1000) / 1000) };
    }
    const o = new THREE.Object3D();
    o.name = 'SEAT_' + i;
    o.position.copy(at);
    o.userData = { yaw: Math.round(Math.atan2(-fwd.x, -fwd.z) * 1000) / 1000, eye: s.eye, ...(best ? { table: best.at } : {}), ...(waiterWays[i] ?? {}) };
    out.add(o);
  });
  console.log('seats', seats.length, 'with a table', out.children.filter(o => o.userData.table).length);
  scene.updateMatrixWorld(true);
  let meshes = 0, tris = 0;
  scene.traverse(o => { if (o.isMesh) { meshes++; const g=o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count)/3; } });
  const glb = await new GLTFExporter().parseAsync(scene, { binary: true, maxTextureSize: 1024 });
  const bytes = new Uint8Array(glb);
  let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  window.result = { b64: btoa(s), meshes, tris: Math.round(tris) };
} catch (e) { window.result = { error: String(e && e.stack || e) }; }
</script></body></html>
